<title>日帰り低山マップ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 地図(左) + 山の案内パネル(右)。狭い画面では縦に積む。国土地理院の地形図を思わせる淡い水色の海と若草色の陸。 */
:root {
  --bg: #f3f6f4;
  --surface: #ffffff;
  --ink: #1d2a26;
  --muted: #5b6b66;
  --line: #d5dfdb;
  --sea: #dce9ef;
  --sky: #f4f8fa;
  --land: #e7efe0;
  --land-hover: #d6e5cb;
  --border-land: #a9bfa8;
  --accent: #1f6f5c;
  --accent-soft: #e0efe9;
  --lv1: #2e8b57;
  --lv2: #d08a12;
  --lv3: #c2492f;
  --pin-stroke: #ffffff;
  --warn-bg: #fff4e0;
  --warn-ink: #7a4d00;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a18; --surface: #19231f; --ink: #e6eeea; --muted: #9db0a9; --line: #2c3a35;
    --sea: #15242b; --sky: #0e1619; --land: #24342b; --land-hover: #2f4537; --border-land: #46604f;
    --accent: #6cc7ab; --accent-soft: #1f3530; --lv1: #5cc489; --lv2: #f0b245; --lv3: #ef7a5e;
    --pin-stroke: #121a18; --warn-bg: #3a2c12; --warn-ink: #f6cf8a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a18; --surface: #19231f; --ink: #e6eeea; --muted: #9db0a9; --line: #2c3a35;
  --sea: #15242b; --sky: #0e1619; --land: #24342b; --land-hover: #2f4537; --border-land: #46604f;
  --accent: #6cc7ab; --accent-soft: #1f3530; --lv1: #5cc489; --lv2: #f0b245; --lv3: #ef7a5e;
  --pin-stroke: #121a18; --warn-bg: #3a2c12; --warn-ink: #f6cf8a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header > div:first-child { flex: 1 1 420px; min-width: 0; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 4vw, 36px); margin: 0; line-height: 1.25; text-wrap: balance; }
.lede { margin: 2px 0 0; color: var(--muted); max-width: 60ch; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.tri { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 12px solid currentColor; display: inline-block; }

.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.mapcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .label { font-size: 12px; color: var(--muted); letter-spacing: .08em; align-self: center; margin-right: 2px; }
button.chip {
  font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
button.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button.chip:focus-visible, .pin:focus-visible, .list button:focus-visible, .season button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.mapbox { background: var(--sea); border-radius: 10px; overflow: hidden; position: relative; }
svg#map { display: block; width: 100%; height: auto; aspect-ratio: 850 / 900; max-width: 100%; touch-action: manipulation; }
.pref { fill: var(--land); stroke: var(--border-land); stroke-width: .6; vector-effect: non-scaling-stroke; transition: fill .2s; }
.pref.active { fill: var(--land-hover); }
.inset { fill: none; stroke: var(--border-land); stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.inset-label { fill: var(--muted); font-family: var(--font-body); }
.pin { cursor: pointer; outline: none; }
.pin path { stroke: var(--pin-stroke); stroke-linejoin: round; vector-effect: non-scaling-stroke; stroke-width: 1.6; transition: transform .15s; }
.pin.lv1 path { fill: var(--lv1); } .pin.lv2 path { fill: var(--lv2); } .pin.lv3 path { fill: var(--lv3); }
.pin text { font-family: var(--font-body); font-weight: 700; fill: var(--ink); paint-order: stroke; stroke: var(--sea); stroke-linejoin: round; pointer-events: none; }
.pin .ring { fill: none; stroke: var(--accent); vector-effect: non-scaling-stroke; stroke-width: 2.5; opacity: 0; }
.pin.sel .ring { opacity: 1; }
.pin.dim { opacity: .18; pointer-events: none; }
.viewtabs { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; align-self: flex-start; }
.viewtabs button { font: inherit; font-size: 14px; font-weight: 700; padding: 6px 18px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.viewtabs button + button { border-left: 1px solid var(--line); }
.viewtabs button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.viewtabs button:focus-visible, .scene-ctl button:focus-visible, .btn3d:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#scene { position: relative; aspect-ratio: 850 / 900; max-width: 100%; background: linear-gradient(var(--sky), var(--sea)); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#scene.drag { cursor: grabbing; }
#scene canvas { display: block; width: 100%; height: 100%; }
.scene-title { position: absolute; left: 12px; right: 64px; top: 10px; display: flex; flex-direction: column; pointer-events: none; }
.scene-title b { font-family: var(--font-display); font-size: 22px; line-height: 1.2; }
.scene-title span { font-size: 12px; color: var(--muted); }
.compass { position: absolute; right: 12px; top: 12px; width: 42px; height: 42px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; pointer-events: none; }
.compass i { display: block; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 15px solid var(--lv3); position: relative; top: -6px; }
.compass i::after { content: ""; position: absolute; left: -6px; top: 15px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 15px solid var(--muted); }
.compass span { position: absolute; top: -18px; font-size: 11px; font-weight: 700; color: var(--lv3); }
.summit-label { position: absolute; left: 0; top: 0; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; font-size: 12.5px; font-weight: 700; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.summit-label::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -5px; border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 6px solid var(--surface); }
.summit-label b { font-family: var(--font-data); font-weight: 500; }
.scene-ctl { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; pointer-events: none; }
.scene-ctl > div { display: flex; gap: 4px; align-items: center; pointer-events: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.scene-ctl small { font-size: 11px; color: var(--muted); padding: 0 4px; }
.scene-ctl button { font: inherit; font-size: 12px; padding: 2px 9px; border-radius: 5px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.scene-ctl button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.scene-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
.btn3d { font: inherit; font-size: 13.5px; font-weight: 700; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); cursor: pointer; align-self: flex-start; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }

.list { display: flex; flex-wrap: wrap; gap: 6px; }
.list button { font: inherit; font-size: 13px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.list button .dot { width: 8px; height: 8px; border-radius: 50%; }
.list button[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.list button[hidden] { display: none; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 18px; min-width: 0; scroll-margin-top: 12px; }
.mt-head { display: flex; flex-direction: column; gap: 4px; }
.kana { font-size: 12.5px; color: var(--muted); letter-spacing: .15em; }
.mt-name { font-family: var(--font-display); font-size: clamp(28px, 3.6vw, 38px); font-weight: 800; margin: 0; line-height: 1.2; }
.pref-tag { font-size: 13px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
@media (max-width: 460px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); padding: 8px 10px; display: flex; flex-direction: column; }
.stat small { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.stat b { font-family: var(--font-data); font-weight: 500; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat b.jp { font-family: var(--font-body); font-weight: 700; font-size: 16px; }
.lvpill { display: inline-block; padding: 0 8px; border-radius: 999px; color: var(--surface); font-size: 13px; font-weight: 700; }
.desc { margin: 0; }
.course { font-size: 13.5px; color: var(--muted); margin: 0; }
.course b { color: var(--ink); font-weight: 500; }

h3 { font-size: 13px; letter-spacing: .12em; color: var(--accent); margin: 0 0 8px; font-weight: 700; }
.season { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.season button { font: inherit; font-size: 13px; padding: 4px 14px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.season button + button { border-left: 1px solid var(--line); }
.season button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.season-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.temp { font-size: 13px; color: var(--muted); }
.temp b { font-family: var(--font-data); color: var(--ink); font-weight: 500; }

.layers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 460px) { .layers { grid-template-columns: minmax(0, 1fr); } }
.layer { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.layer small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.layer p { margin: 2px 0 0; font-size: 13.5px; line-height: 1.6; }
.extras { margin: 8px 0 0; font-size: 13.5px; color: var(--muted); }

.special { display: flex; flex-direction: column; gap: 8px; }
.alert { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; }
.alert b { grid-row: span 2; font-size: 12px; letter-spacing: .05em; border: 1px solid currentColor; border-radius: 4px; padding: 0 6px; align-self: start; margin-top: 3px; white-space: nowrap; }
.alert span { line-height: 1.6; }

ul.check { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 16px; }
@media (max-width: 460px) { ul.check { grid-template-columns: minmax(0, 1fr); } }
ul.check li { min-width: 0; }
ul.check label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; font-size: 14px; line-height: 1.5; padding: 3px 0; }
ul.check input { margin-top: 3px; accent-color: var(--accent); flex: none; width: 16px; height: 16px; }
ul.check .sub { display: block; font-size: 12px; color: var(--muted); }
ul.check input:checked + span { color: var(--muted); text-decoration: line-through; }
.foot { font-size: 12px; color: var(--muted); margin: 0; }
.links { font-size: 13px; }
.links a { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>日帰り低山マップ</h1>
      <p class="lede">日帰りで登れる標高の低い山を、日本地図にまとめました。地図の ▲ をクリックすると、その山に合った服装と持ち物が表示されます。</p>
    </div>
    <div class="legend" aria-label="凡例">
      <span style="color:var(--lv1)"><i class="tri"></i><span style="color:var(--muted)">初級：はじめてでも安心</span></span>
      <span style="color:var(--lv2)"><i class="tri"></i><span style="color:var(--muted)">初中級：急坂・岩場あり</span></span>
    </div>
  </header>

  <div class="grid">
    <section class="mapcard" aria-label="地図">
      <div class="viewtabs" role="group" aria-label="表示切り替え">
        <button type="button" id="view-map" aria-pressed="true">日本地図</button>
        <button type="button" id="view-3d" aria-pressed="false">3D地形</button>
      </div>
      <div class="chips" id="regions"><span class="label">地方</span></div>
      <div class="chips" id="levels"><span class="label">難易度</span></div>
      <div class="mapbox">
        <svg id="map" viewBox="0 0 850 900" role="img" aria-label="日本地図と低山の位置"></svg>
        <div id="scene" hidden>
          <div class="scene-title"><b id="scene-name"></b><span id="scene-sub"></span></div>
          <div class="compass" aria-hidden="true"><span>N</span><i></i></div>
          <div class="summit-label" id="summit-label"></div>
          <div class="scene-ctl">
            <div role="group" aria-label="高さの強調"><small>高さ</small>
              <button type="button" id="ex-1" data-ex="1">等倍</button>
              <button type="button" id="ex-2" data-ex="2" aria-pressed="true">×2</button>
              <button type="button" id="ex-3" data-ex="3">×3</button>
            </div>
            <div><button type="button" id="spin" aria-pressed="true">自動回転</button><button type="button" id="reset">視点を戻す</button></div>
          </div>
        </div>
      </div>
      <p class="hint" id="hint">地方ボタンで拡大できます。下の山名からも選べます。</p>
      <div class="list" id="list"></div>
    </section>

    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
  <p class="foot">コースタイムは休憩を含まない往復の目安です（六甲山のみ片道縦走）。登山道の通行止め、ロープウェイの運行、火山情報、クマの出没情報は出発前に自治体や施設の公式情報で確認してください。</p>
</div>

// 地図座標: Python 側と同じ簡易正距円筒図法 (北緯36度で横方向を補正)
const K = 60, C = Math.cos(36 * Math.PI / 180);
function proj(lat, lon) {
  if (lat < 27.5) return [(lon - 126.6) * C * K + 20, (27.0 - lat) * K + 40]; // 沖縄は左上の枠内
  return [(lon - 128.6) * C * K, (45.7 - lat) * K];
}

// 地方ごとの表示範囲
function bounds(region) {
  if (region === "all") return [0, 0, 850, 900];
  const pts = M.filter(m => m.r === region && !(region === "kyushu" && m.lat < 27.5));
  let x0 = Math.min(...pts.map(m => m.x)), x1 = Math.max(...pts.map(m => m.x));
  let y0 = Math.min(...pts.map(m => m.y)), y1 = Math.max(...pts.map(m => m.y));
  const pad = 55; x0 -= pad; x1 += pad; y0 -= pad; y1 += pad;
  // 地図の縦横比 850:900 に合わせる
  let w = x1 - x0, h = y1 - y0; const ratio = 850 / 900;
  if (w / h < ratio) { const nw = h * ratio; x0 -= (nw - w) / 2; w = nw; } else { const nh = w / ratio; y0 -= (nh - h) / 2; h = nh; }
  const minW = 230; if (w < minW) { x0 -= (minW - w) / 2; y0 -= (minW / ratio - h) / 2; w = minW; h = minW / ratio; }
  return [x0, y0, w, h];
}

let vb = [0, 0, 850, 900], anim;
function zoomTo(target) {
  cancelAnimationFrame(anim);
  const from = vb.slice(), start = performance.now();
  const dur = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 450;
  const step = now => {
    const k = dur ? Math.min(1, (now - start) / dur) : 1, e = 1 - Math.pow(1 - k, 3);
    vb = from.map((v, i) => v + (target[i] - v) * e);
    svg.setAttribute("viewBox", vb.join(" "));
    drawPins();
    if (k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

function drawPins() {
  const s = vb[2] / 850;              // 1 = 全国表示
  const size = 11 * Math.max(s, 0.3);
  const showLabels = s < 0.6;
  for (const m of M) {
    const g = pins[m.id];
    const sz = m.id === state.sel ? size * 1.35 : size;
    g.querySelector("path").setAttribute("d", `M${m.x},${m.y - sz}L${m.x + sz * 0.9},${m.y + sz * 0.6}L${m.x - sz * 0.9},${m.y + sz * 0.6}Z`);
    const ring = g.querySelector(".ring");
    ring.setAttribute("r", sz * 1.6);
    const t = g.querySelector("text");
    const fs = 13 * Math.max(s, 0.3);
    t.setAttribute("font-size", fs);
    t.setAttribute("stroke-width", fs * 0.28);
    t.setAttribute("x", m.x + sz * 1.1);
    t.setAttribute("y", m.y + fs * 0.35);
    t.style.display = showLabels || m.id === state.sel ? "" : "none";
  }
  insetLabel.setAttribute("font-size", 11 * Math.max(s, 0.4));
}

function applyFilters() {

  prefEls.forEach(p => p.classList.toggle("active", state.region !== "all" && p.dataset.r === state.region));

function select(id, fromUser) {
  state.sel = id;
  for (const k in pins) {
    pins[k].classList.toggle("sel", k === id);
    listBtns[k].setAttribute("aria-current", k === id);
  }
  gPins.appendChild(pins[id]); // 選択した山を最前面に
  drawPins(); renderPanel();
  if (state.view === "3d") terrain.show(M.find(x => x.id === id));
  if (fromUser && state.view === "map" && matchMedia("(max-width: 860px)").matches) {
    document.getElementById("panel").scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function waterLiters(m) {
  const per = { spring: 0.4, summer: 0.6, autumn: 0.4, winter: 0.3 }[state.season];
  return Math.max(0.5, Math.ceil(m.t * per * 2) / 2);
}

    <div>

// ===== 3D地形 =====
// DEM: 山頂を中心にした N×N の標高グリッド (AWS Terrain Tiles / 国土地理院などの標高データ由来)。
// 値は 0 = 海、それ以外は 標高(m)+1 の Uint16。
const GRID = 100, WORLD = 10;
function decodeDem(id) {
  const bin = atob(DEM[id].d), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  const raw = new Uint16Array(buf.buffer), e = new Float32Array(raw.length);
  for (let i = 0; i < raw.length; i++) e[i] = raw[i] === 0 ? 0 : raw[i] - 1;
  return e;
}

// 低い所の緑 → 高い所の茶・白 (段彩図)
const RAMP = [[0, [111, 155, 90]], [0.3, [160, 186, 112]], [0.55, [214, 201, 140]], [0.8, [183, 142, 96]], [1, [236, 228, 214]]];
function rampColor(t) {
  for (let i = 1; i < RAMP.length; i++) {
    if (t <= RAMP[i][0]) {
      const [t0, a] = RAMP[i - 1], [t1, b] = RAMP[i], k = (t - t0) / (t1 - t0);
      return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
    }
  }
  return RAMP[RAMP.length - 1][1];
}

// 段彩 + 等高線を描いたテクスチャ
function buildTexture(e, lo, hi) {
  const S = 512, cv = document.createElement("canvas");
  cv.width = cv.height = S;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(S, S);
  const relief = hi - lo, iv = relief < 350 ? 20 : relief < 700 ? 50 : 100;
  const at = (x, y) => {
    const gx = x / (S - 1) * (GRID - 1), gy = y / (S - 1) * (GRID - 1);
    const x0 = Math.min(GRID - 2, Math.floor(gx)), y0 = Math.min(GRID - 2, Math.floor(gy)), dx = gx - x0, dy = gy - y0;
    const i = y0 * GRID + x0;
    return e[i] * (1 - dx) * (1 - dy) + e[i + 1] * dx * (1 - dy) + e[i + GRID] * (1 - dx) * dy + e[i + GRID + 1] * dx * dy;
  };
  const h = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) h[y * S + x] = at(x, y);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const v = h[y * S + x], o = (y * S + x) * 4;
    let c;
    if (v <= 0.5) c = [120, 170, 196];
    else {
      c = rampColor(Math.max(0, Math.min(1, (v - lo) / (relief || 1))));
      const r = x < S - 1 ? h[y * S + x + 1] : v, d = y < S - 1 ? h[(y + 1) * S + x] : v;
      const lv = Math.floor(v / iv);
      if (lv !== Math.floor(r / iv) || lv !== Math.floor(d / iv)) {
        const major = Math.max(lv, Math.floor(r / iv), Math.floor(d / iv)) % 5 === 0;
        const k = major ? 0.55 : 0.78;
        c = [c[0] * k, c[1] * k, c[2] * k];
      }
    }
    img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  return { tex, iv };
}

const terrain = (() => {
  const box = document.getElementById("scene");
  const label = document.getElementById("summit-label");
  const compass = box.querySelector(".compass");
  let renderer, scene, camera, group, ok = false, mt = null, data = null;
  let ex = 2, spin = true, az = 0.5, el = 0.6, dist = 18.5, target = null, summit = null, raf = 0, needs = true;

  function init() {
    if (ok) return true;
    if (typeof THREE === "undefined") return fail("3D表示用のライブラリを読み込めませんでした。通信環境を確認して、ページを再読み込みしてください。");
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    } catch (err) {
      return fail("この端末・ブラウザでは3D表示を利用できません。");
    }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    box.prepend(renderer.domElement);
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
    target = new THREE.Vector3();
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a66, 0.75));
    const sun = new THREE.DirectionalLight(0xffffff, 0.75);
    sun.position.set(-6, 10, -4); // 北西からの光 (地図の陰影の慣習)
    scene.add(sun);
    new ResizeObserver(resize).observe(box);
    bindControls();
    ok = true;
    resize();
    return true;
  }
  function fail(msg) {
    if (!box.querySelector(".scene-msg")) {
      const d = document.createElement("div"); d.className = "scene-msg"; d.textContent = msg; box.appendChild(d);
    }
    return false;
  }
  function resize() {
    if (!ok) return;
    const w = box.clientWidth, h = box.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix(); needs = true;
  }

  function build() {
    if (group) {
      scene.remove(group);
      group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
    }
    const { e, lo, hi, km, tex } = data;
    const s = WORLD / (km * 1000);                 // 1m あたりのワールド単位
    const yOf = v => (Math.max(v, 0) - lo) * s * ex;
    const base = -0.35;
    group = new THREE.Group();

    const geo = new THREE.PlaneGeometry(WORLD, WORLD, GRID - 1, GRID - 1);
    geo.rotateX(-Math.PI / 2);                     // 北 = -Z
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) pos.setY(i, yOf(e[i]));
    geo.computeVertexNormals();
    group.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: tex })));

    // 側面 (ジオラマの断面)
    const wall = [], half = WORLD / 2, step = WORLD / (GRID - 1);
    const edge = (list) => {
      for (let k = 0; k < list.length - 1; k++) {
        const [x1, z1, v1] = list[k], [x2, z2, v2] = list[k + 1];
        const y1 = yOf(v1), y2 = yOf(v2);
        wall.push(x1, y1, z1, x1, base, z1, x2, y2, z2, x2, y2, z2, x1, base, z1, x2, base, z2);
      }
    };
    const N = [], S = [], W = [], E = [];
    for (let i = 0; i < GRID; i++) {
      N.push([-half + i * step, -half, e[i]]);
      S.push([-half + i * step, half, e[(GRID - 1) * GRID + i]]);
      W.push([-half, -half + i * step, e[i * GRID]]);
      E.push([half, -half + i * step, e[i * GRID + GRID - 1]]);
    }
    [N, S, W, E].forEach(edge);
    const wg = new THREE.BufferGeometry();
    wg.setAttribute("position", new THREE.Float32BufferAttribute(wall, 3));
    wg.computeVertexNormals();
    group.add(new THREE.Mesh(wg, new THREE.MeshLambertMaterial({ color: 0x8b6b4a, side: THREE.DoubleSide })));
    const bg = new THREE.PlaneGeometry(WORLD, WORLD); bg.rotateX(Math.PI / 2); bg.translate(0, base, 0);
    group.add(new THREE.Mesh(bg, new THREE.MeshLambertMaterial({ color: 0x6b5238 })));

    // 山頂の目印
    const [si, sj] = DEM[mt.id].s;
    const sx = -half + si * step, sz = -half + sj * step, sy = yOf(e[sj * GRID + si]);
    summit = new THREE.Vector3(sx, sy, sz);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.6, 8), new THREE.MeshLambertMaterial({ color: 0xffffff }));
    pole.position.set(sx, sy + 0.3, sz);
    const flag = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.28, 12), new THREE.MeshLambertMaterial({ color: mt.lv === 1 ? 0x2e8b57 : 0xd08a12 }));
    flag.position.set(sx, sy + 0.7, sz);
    group.add(pole, flag);
    scene.add(group);
    target.set(0, sy * 0.4, 0);
    needs = true;
  }

  function show(m) {
    if (!init()) return;
    mt = m;
    const e = decodeDem(m.id);
    let lo = Infinity, hi = -Infinity;
    for (const v of e) { if (v > 0.5 && v < lo) lo = v; if (v > hi) hi = v; }
    if (lo === Infinity) lo = 0;
    if (data) data.tex.dispose();
    const km = DEM[m.id].h * 2, t = buildTexture(e, lo, hi);
    data = { e, lo, hi, km, tex: t.tex };
    document.getElementById("scene-name").textContent = m.n;
    document.getElementById("scene-sub").textContent = `表示範囲 ${km}km 四方・等高線 ${t.iv}m 間隔・高さ${ex === 1 ? "は等倍" : ` ×${ex} で強調`}`;
    label.innerHTML = `${m.n.replace(/（.*）/, "")} <b>${m.e}m</b>`;
    build();
    loop();
  }

  function setEx(v) {
    ex = v;
    box.querySelectorAll("[data-ex]").forEach(b => b.setAttribute("aria-pressed", b.dataset.ex == v));
    if (mt) show(mt);
  }

  function bindControls() {
    const pts = new Map(); let pinch = 0;
    box.addEventListener("pointerdown", ev => {
      if (ev.target.closest(".scene-ctl")) return;
      box.setPointerCapture(ev.pointerId); pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
      box.classList.add("drag"); stopSpin();
    });
    box.addEventListener("pointermove", ev => {
      if (!pts.has(ev.pointerId)) return;
      const [px, py] = pts.get(ev.pointerId);
      if (pts.size === 1) {
        az -= (ev.clientX - px) * 0.008;
        el = Math.max(0.15, Math.min(1.45, el + (ev.clientY - py) * 0.006));
      }
      pts.set(ev.pointerId, [ev.clientX, ev.clientY]);
      if (pts.size === 2) {
        const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
        if (pinch) dist = Math.max(6, Math.min(28, dist * pinch / d));
        pinch = d;
      }
      needs = true;
    });
    const up = ev => { pts.delete(ev.pointerId); pinch = 0; if (!pts.size) box.classList.remove("drag"); };
    box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
    box.addEventListener("wheel", ev => { ev.preventDefault(); dist = Math.max(6, Math.min(28, dist * (1 + Math.sign(ev.deltaY) * 0.1))); needs = true; }, { passive: false });
    box.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => setEx(Number(b.dataset.ex)));
    document.getElementById("spin").onclick = () => { spin = !spin; document.getElementById("spin").setAttribute("aria-pressed", spin); };
    document.getElementById("reset").onclick = () => { az = 0.5; el = 0.6; dist = 18.5; needs = true; };
  }
  function stopSpin() { spin = false; document.getElementById("spin").setAttribute("aria-pressed", "false"); }

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { spin = false; document.getElementById("spin").setAttribute("aria-pressed", "false"); }

  function loop() {
    cancelAnimationFrame(raf);
    const frame = () => {
      if (state.view !== "3d") return;
      if (spin) { az += 0.003; needs = true; }
      if (needs) {
        camera.position.set(target.x + dist * Math.cos(el) * Math.sin(az), target.y + dist * Math.sin(el), target.z + dist * Math.cos(el) * Math.cos(az));
        camera.lookAt(target);
        renderer.render(scene, camera);
        compass.style.transform = `rotate(${az * 180 / Math.PI}deg)`;
        if (summit) {
          const p = summit.clone(); p.y += 0.9; p.project(camera);
          label.style.left = `${(p.x + 1) / 2 * box.clientWidth}px`;
          label.style.top = `${(1 - p.y) / 2 * box.clientHeight}px`;
        }
        needs = false;
      }
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  }
  return { show };
})();

function setView(v) {
  state.view = v;
  document.getElementById("view-map").setAttribute("aria-pressed", v === "map");
  document.getElementById("view-3d").setAttribute("aria-pressed", v === "3d");
  svg.style.display = v === "map" ? "" : "none";
  document.getElementById("scene").hidden = v !== "3d";
  regionsEl.hidden = levelsEl.hidden = v !== "map";
  document.getElementById("hint").textContent = v === "map"
    ? "地方ボタンで拡大できます。下の山名からも選べます。"
    : "ドラッグで回転、ホイールやピンチで拡大・縮小できます。下の山名を押すと別の山に切り替わります。";
  applyFilters();
  renderPanel();
  if (v === "3d") terrain.show(M.find(x => x.id === state.sel));
}
document.getElementById("view-map").onclick = () => setView("map");
document.getElementById("view-3d").onclick = () => setView("3d");

applyFilters();
select(state.sel, false);
</script>
